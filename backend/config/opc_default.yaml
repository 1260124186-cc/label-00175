# ============================================================================
# OPC (Optical Proximity Correction) 默认配置文件
# ============================================================================
# 本配置文件定义了 OPC 工作流的所有可调参数。
# 根据不同的工艺节点（如 45nm、28nm、14nm），需要相应调整参数。

# ============================================================================
# OPC 工作流核心参数
# ============================================================================
opc:
  # ---------- 热点检测参数 ----------
  # EPE 热点判定阈值 (nm)
  # 边缘放置误差超过此阈值的区域被标记为热点
  epe_threshold: 3.0

  # EPE 收敛阈值 (nm)
  # 当平均 EPE 低于此阈值时认为校正完成
  epe_convergence_threshold: 1.0

  # 最大迭代次数
  max_iterations: 10

  # 最小热点区域面积（像素）
  # 小于此面积的连通域不被视为热点
  min_hotspot_area: 4

  # 热点区域膨胀像素数
  # 对检测到的热点区域进行膨胀，确保覆盖完整的校正范围
  hotspot_dilation: 2

  # ---------- 基于规则的校正参数 ----------
  # 每次边缘偏移步长（像素）
  edge_offset_step: 0.5

  # 最大边缘偏移量（像素）
  max_edge_offset: 3.0

  # 拐角 serif 尺寸（像素）
  # 外拐角添加的 serif 大小
  corner_bias_size: 1.0

  # 线端延伸长度（像素）
  # 用于补偿线端缩短效应
  line_end_extension: 2.0

  # 线端延伸宽度（像素）
  line_end_width: 2.0

  # ---------- SRAF 参数 ----------
  # 是否启用 SRAF 插入
  sraf_enable: true

  # SRAF 与主特征最小间距（像素）
  sraf_min_distance: 2.0

  # SRAF 与主特征最大间距（像素）
  sraf_max_distance: 5.0

  # SRAF 宽度（像素）
  # 必须小于光刻系统分辨率极限（亚分辨率）
  sraf_width: 1.0

  # SRAF 长度（像素）
  sraf_length: 4.0

  # 相邻 SRAF 最小间距（像素）
  sraf_spacing: 2.0

  # SRAF 最小特征尺寸（像素）
  sraf_min_feature_size: 1.0

  # SRAF 最大长宽比
  sraf_max_aspect_ratio: 10.0

  # ---------- MaskOptimizer 精细优化参数 ----------
  # 是否启用 MaskOptimizer 精细优化
  optimizer_enable: true

  # 优化器每轮最大迭代次数
  optimizer_max_iter: 20

  # 优化器学习率
  optimizer_learning_rate: 0.05

  # 优化器 EPE 损失权重
  optimizer_epe_weight: 1.0

  # ---------- 通用参数 ----------
  # 像素尺寸 (nm)
  pixel_size: 1.0

  # 晶圆成像二值化阈值
  wafer_threshold: 0.3

  # 是否输出详细日志
  verbose: true

# ============================================================================
# 光学系统参数（与 default_config.yaml 保持一致）
# ============================================================================
optical_system:
  # 光源波长 (nm), ArF 光源
  wavelength: 193.0

  # 数值孔径 (Numerical Aperture)
  na: 1.35

  # 部分相干因子 (0~1)
  sigma: 0.75

  # 像素尺寸 (nm)
  pixel_size: 1.0

  # 离焦量 (nm)
  defocus: 0.0

  # 放大倍率
  magnification: 4.0

  # 照明模式: conventional, annular, dipole, quasar, custom
  illumination_type: conventional

  # 光源形状参数
  source_params:
    # conventional/annular: sigma_inner, sigma_outer
    sigma_inner: 0.0
    sigma_outer: 0.75

  # TCC 计算模式: full_tcc, socs, kernel_2d
  tcc_mode: socs

  # SOCS 分解项数（仅 socs 模式生效）
  socs_num_terms: 5

  # Zernike 像差系数（单位: 波长λ）
  zernike_coefficients: {}

# ============================================================================
# 测试图案配置（示例使用）
# ============================================================================
test_pattern:
  # 图案类型: line_space, contact_hole, l_shaped_corner, t_junction, sram_bitcell
  type: line_space

  # 网格尺寸 (ny, nx)
  grid_size: [64, 64]

  # 关键尺寸 (nm)
  cd: 45.0

  # 间距 (nm)
  pitch: 90.0

  # 拐角圆滑度 (nm)
  corner_rounding: 0.0

  # 线方向: horizontal, vertical
  orientation: horizontal
