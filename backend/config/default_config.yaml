# 计算光刻仿真框架默认配置文件
# Default Configuration for Lithography Simulation Framework

# 系统配置
system:
  device: cpu                     # 计算设备: cpu 或 cuda (GPU加速，需要安装CuPy)

# 光学系统参数
optical_system:
  wavelength: 193.0      # 光源波长 (nm), ArF光源
  na: 1.35               # 数值孔径 (Numerical Aperture)
  sigma: 0.75            # 部分相干因子 (0~1)
  pixel_size: 1.0        # 像素尺寸 (nm)
  defocus: 0.0           # 离焦量 (nm)
  magnification: 4.0     # 放大倍率
  # 照明模式: conventional, annular, dipole, quasar, custom
  illumination_type: conventional
  # 光源形状参数
  source_params:
    # conventional/annular: sigma_inner, sigma_outer
    sigma_inner: 0.0
    sigma_outer: 0.75
    # dipole/quasar: angle, opening_angle
    # angle: 0.0           # 极角 (度)
    # opening_angle: 60.0  # 开口角 (度)
  # SOCS低秩分解配置
  # tcc_mode: TCC 计算模式: full_tcc, socs, kernel_2d
  #   - full_tcc: 完整TCC（光源积分法），精度最高，速度最慢
  #   - socs: SOCS 低秩近似，精度与速度平衡
  #   - kernel_2d: 二维 TCC 核对角近似，速度最快，精度最低
  tcc_mode: socs
  socs_num_terms: 5      # SOCS分解项数（仅 socs 模式生效）
  use_socs: true         # [已弃用] 旧版配置，向后兼容
  # Zernike像差系数（单位: 波长λ）
  # 支持名称和索引两种格式，名称对照:
  #   piston=0, tilt_x=1, tilt_y=2, defocus=3,
  #   astigmatism_x=4, astigmatism_y=5, coma_y=6, coma_x=7,
  #   trefoil_y=8, trefoil_x=9, spherical=10,
  #   secondary_astigmatism_x=11, secondary_astigmatism_y=12,
  #   secondary_coma_x=13, secondary_coma_y=14, secondary_spherical=15
  zernike_coefficients: {}
  # 示例: 注入球差和彗差
  # zernike_coefficients:
  #   spherical: 0.05
  #   coma_x: 0.03

# 优化参数
optimization:
  optimizer_type: gradient_descent  # 优化器类型: gradient_descent, bfgs, newton, genetic, pso, rl
  max_iter: 100                     # 最大迭代次数
  learning_rate: 0.01               # 学习率 (梯度下降)
  tol: 1.0e-6                       # 收敛容差
  early_stop_patience: 10           # 早停耐心值
  lr_scheduler: null                # 学习率调度器: step, exponential, cosine, null
  lr_decay: 0.95                    # 学习率衰减率
  lr_step_size: 20                  # 学习率调度步长
  metric: mse                       # 优化目标指标: mse, mae, ssim（兼容旧接口）
  use_composite_loss: false         # 是否启用复合损失函数（优先级高于 metric）

  # 复合损失各分量权重
  # loss = w_mse*MSE + w_ssim*(1-SSIM) + w_pvb*PVB + w_mask_complexity*TV(mask)
  #        + w_weighted_mse*WMSE + w_weighted_mae*WMAE
  loss_weights:
    mse: 1.0                        # MSE 权重
    ssim: 0.0                       # (1-SSIM) 权重
    pvb: 0.0                        # PVB (工艺变化带宽) 权重，仅多工艺优化时有效
    mask_complexity: 0.0            # 掩模复杂度(总变差TV)权重
    weighted_mse: 0.0               # 空间加权MSE权重（热点区域更关注）
    weighted_mae: 0.0               # 空间加权MAE权重

  # 空间加权误差配置（在关键区域如线端、拐角设置更高权重）
  spatial_weight:
    enable: false                   # 是否启用空间加权
    edge_weight: 2.0                # 边缘区域权重倍率
    corner_weight: 5.0              # 拐角区域权重倍率
    line_end_weight: 4.0            # 线端区域权重倍率
    base_weight: 1.0                # 基础区域权重
    edge_sigma: 1.0                 # 边缘检测的高斯平滑sigma（像素）
    corner_threshold: 0.3           # 拐角检测阈值（0-1，越大越严格）
    line_end_threshold: 0.5         # 线端检测阈值
    weight_erosion: true            # 是否对权重做形态学腐蚀以避免边界伪影
    smooth_sigma: 0.5               # 权重mask的高斯平滑sigma
    normalize: true                 # 是否将权重归一化到均值为1

  # 正则化配置
  regularization:
    type: null                      # 正则化类型: null, l1, l2, tv
    strength: 0.0                   # 正则化强度系数

  bounds:                           # 掩模值边界
    - 0.0
    - 1.0
  verbose: true                     # 是否输出详细信息
  random_seed: 42                   # 随机种子（用于结果复现，null表示不固定）

  # 启发式算法参数 (遗传算法/粒子群)
  population_size: 50               # 种群大小
  crossover_rate: 0.8               # 交叉概率
  mutation_rate: 0.1                # 变异概率
  n_jobs: 1                         # 并行工作进程数，1表示串行，-1表示使用所有CPU核心

  # 强化学习参数
  rl_gamma: 0.99                    # 折扣因子
  rl_epsilon: 0.1                   # 初始探索率
  rl_epsilon_decay: 0.995           # 探索率衰减

# 输出配置
output:
  save_dir: ./results               # 结果保存目录
  save_images: true                 # 是否保存图像
  save_history: true                # 是否保存历史数据
  image_format: png                 # 图像格式: png, tiff
  log_level: INFO                   # 日志级别: DEBUG, INFO, WARNING, ERROR

# 成像模拟参数
imaging:
  resist_threshold: 0.3             # 光刻胶阈值
  apply_resist: true                # 是否应用光刻胶响应
