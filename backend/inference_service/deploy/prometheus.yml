# ========================================================================
# Prometheus 配置 - 采集推理微服务指标
# ========================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: litho-production
    environment: prod

rule_files:
  # - "alerts.yml"

scrape_configs:
  # 推理服务 HTTP metrics 端点
  - job_name: litho-inference-http
    metrics_path: /metrics
    static_configs:
      - targets:
          - inference-service:8080
        labels:
          service: litho-inference
          protocol: http

  # 如果启用了独立 Prometheus 端口:
  # - job_name: litho-inference-prometheus
  #   static_configs:
  #     - targets:
  #         - inference-service:9090
  #       labels:
  #         service: litho-inference
  #         protocol: prometheus

  # 也可以通过 gRPC 端点 (如果启用了 gRPC metrics exporter)
  # - job_name: litho-inference-grpc
  #   static_configs:
  #     - targets:
  #         - inference-service:50051
  #       labels:
  #         service: litho-inference
  #         protocol: grpc
