# ========================================================================
# Grafana 数据源配置
# ========================================================================
apiVersion: 1

datasources:
  - name: Prometheus (Litho)
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"
      queryTimeout: "30s"
