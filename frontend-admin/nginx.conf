server {
    listen 80;
    server_name _;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;
    gzip_min_length 1024;

    # 客户端请求大小上限
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # HTML 页面：禁用缓存 + 清除旧 Service Worker，防止旧应用残留
    location = /index.html {
        add_header Clear-Site-Data "\"storage\", \"cookies\"" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 反代 API 到后端 api 容器（docker-compose 中 service 名 = "api"）
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 流式响应支持（如果将来加 SSE）
        proxy_buffering off;
    }

    # 也反代 Swagger 文档，方便调试
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------
    # SPA history 模式 fallback
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源强缓存
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }
}
