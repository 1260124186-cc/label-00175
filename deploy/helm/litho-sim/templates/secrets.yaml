apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litho-sim.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.global.jwtSecret | quote }}
  redisPassword: {{ include "litho-sim.redis.password" . | quote }}
  celeryBrokerUrl: {{ printf "redis://:%s@%s:%s/0" (include "litho-sim.redis.password" .) (include "litho-sim.redis.host" .) (include "litho-sim.redis.port" .) | quote }}
  celeryResultBackend: {{ printf "redis://:%s@%s:%s/1" (include "litho-sim.redis.password" .) (include "litho-sim.redis.host" .) (include "litho-sim.redis.port" .) | quote }}
---
{{- if .Values.flower.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litho-sim.fullname" . }}-flower-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth: {{ printf "%s:{PLAIN}%s" .Values.flower.auth.username .Values.flower.auth.password | b64enc | quote }}
  username: {{ .Values.flower.auth.username | quote }}
  password: {{ .Values.flower.auth.password | quote }}
{{- end }}
