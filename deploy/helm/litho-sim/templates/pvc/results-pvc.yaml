{{- if or .Values.api.persistence.enabled .Values.celeryWorker.persistence.enabled -}}
{{- $fullName := include "litho-sim.fullname" . -}}
{{- $storageClass := .Values.global.storageClass -}}

{{- if .Values.api.persistence.enabled -}}
{{- if not .Values.api.persistence.existingClaim -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-results
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    - {{ .Values.api.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- else if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
---
{{- end -}}
{{- end -}}

{{- if .Values.api.persistence.enabled -}}
{{- if not .Values.api.persistence.existingClaim -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    - {{ .Values.api.persistence.accessMode }}
  resources:
    requests:
      storage: 1Gi
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- else if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
---
{{- end -}}
{{- end -}}

{{- if .Values.api.persistence.enabled -}}
{{- if not .Values.api.persistence.existingClaim -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
    - {{ .Values.api.persistence.accessMode }}
  resources:
    requests:
      storage: 1Gi
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- else if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
---
{{- end -}}
{{- end -}}

{{- if .Values.celeryWorker.persistence.enabled -}}
{{- if not .Values.celeryWorker.persistence.existingClaim -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}-worker-results
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  accessModes:
    - {{ .Values.celeryWorker.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.celeryWorker.persistence.size }}
  {{- if .Values.celeryWorker.persistence.storageClass }}
  storageClassName: {{ .Values.celeryWorker.persistence.storageClass | quote }}
  {{- else if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
{{- end -}}
{{- end -}}
{{- end -}}
