{{- if .Values.flower.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litho-sim.fullname" . }}-flower
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litho-sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  type: {{ .Values.flower.service.type }}
  ports:
    - port: {{ .Values.flower.service.port }}
      targetPort: 5555
      protocol: TCP
      name: flower
  selector:
    {{- include "litho-sim.componentLabels" (dict "component" "flower" "Release" .Release "Chart" .Chart "Values" .Values) | nindent 4 }}
{{- end -}}
