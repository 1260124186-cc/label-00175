# 计算光刻仿真框架 Docker Compose 配置
#
# 一键部署（前后端 Web 工作台）:
#   docker compose up -d --build
#   然后访问: http://localhost:8080
#
# 仅命令行使用（原 backend CLI 服务）:
#   docker compose run --rm backend python -m examples.run_optimization
#
# 镜像源切换说明（官方镜像位于 library/ 命名空间，以下前缀均可直接使用）:
#   设置环境变量 IMAGE_REGISTRY 即可切换：
#     - 默认值: docker.io/            （直连 Docker Hub，绕过 daemon.json 中失效的镜像）
#     - DaoCloud: docker.m.daocloud.io/
#     - 网易: hub-mirror.c.163.com/
#     - 阿里云: 需使用个人专属加速地址，参考阿里云容器服务文档
#   示例: IMAGE_REGISTRY=docker.m.daocloud.io/ docker compose up -d --build
#

x-common-build: &common-build
  args:
    IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/}

x-image-registry: &image_registry "${IMAGE_REGISTRY:-docker.io/}"

services:
  # ============================================================
  # [默认启动] 后端 API 服务（FastAPI）
  # ============================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
      <<: *common-build
    container_name: litho-api
    restart: unless-stopped
    volumes:
      - ./results:/app/results
      - ./backend/api/saved_configs:/app/api/saved_configs
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - TZ=Asia/Shanghai
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 1G

  # ============================================================
  # [默认启动] 前端 admin（Vue3 + Nginx 反代 /api）
  # ============================================================
  web:
    build:
      context: ./frontend-admin
      <<: *common-build
    container_name: litho-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ============================================================
  # 后端 CLI 服务（命令行运行示例；默认不启动）
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-sim-backend
    profiles: ["cli"]
    volumes:
      # 挂载结果输出目录
      - ./results:/app/results
      # 挂载版图/GDS 输入目录
      - ./layout_library:/app/layout_library:ro
      # 挂载配置文件（可选）
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    # 运行优化示例
    command: python -m examples.run_optimization
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ------------------------------------------------------------------
  # 批处理调度：分布式模式需要的 Redis 消息队列
  #   - 作为 Celery Broker（db 0）和 Result Backend（db 1）
  #   - 开启 AOF 持久化，防止重启后任务丢失
  #   - 最大内存 512MB，使用 allkeys-lru 策略淘汰
  # ------------------------------------------------------------------
  redis:
    image: ${IMAGE_REGISTRY:-docker.io/}library/redis:7-alpine
    container_name: litho-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --loglevel notice
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    ports:
      - "6379:6379"
    profiles:
      - distributed
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M

  # ------------------------------------------------------------------
  # Celery Worker（分布式优化执行节点，可水平扩展）
  #   启动多副本示例：
  #     docker compose up -d --scale celery_worker=4
  #   调整单容器内并发数（每个worker进程数）：
  #     CELERY_CONCURRENCY=4 docker compose up -d celery_worker
  #   健康检查：通过 celery inspect ping 验证 worker 存活
  # ------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    volumes:
      - ./results:/app/results
      - ./layout_library:/app/layout_library:ro
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_QUEUE=litho_batch
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - TZ=Asia/Shanghai
    command: >
      celery -A pipeline.batch_runner.celery_app
             worker
             -Q $${CELERY_QUEUE:-litho_batch}
             --concurrency=$${CELERY_CONCURRENCY:-2}
             --loglevel=INFO
             --hostname=worker@%h
             --pool=prefork
             --task-events
             --without-mingle
             --without-gossip
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - distributed
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "sh", "-c", "celery -A pipeline.batch_runner.celery_app inspect ping -d worker@$$(hostname) 2>/dev/null | grep -q 'pong'"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # 批处理调度器服务（本地多进程模式；若需分布式，可改调用 runner=distributed）
  #   用法：
  #     docker compose run --rm batch_runner \
  #       --source /app/layout_library --layer 0 \
  #       --output-dir /app/results/batch_run
  # ------------------------------------------------------------------
  batch_runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-batch-runner
    volumes:
      - ./results:/app/results
      - ./layout_library:/app/layout_library:ro
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - BATCH_MODE=local
      - BATCH_MAX_WORKERS=4
    entrypoint: ["python", "-m", "pipeline.batch_runner_cli"]
    profiles:
      - batch
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  # ------------------------------------------------------------------
  # 批处理调度器（分布式模式 - 提交任务到 Redis/Celery 集群）
  #   用法：
  #     docker compose run --rm batch_scheduler \
  #       --source /app/layout_library --layer 0 \
  #       --output-dir /app/results/batch_run
  # ------------------------------------------------------------------
  batch_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-batch-scheduler
    volumes:
      - ./results:/app/results
      - ./layout_library:/app/layout_library:ro
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TZ=Asia/Shanghai
    entrypoint: ["python", "-m", "pipeline.batch_runner_cli"]
    command: ["--mode", "distributed"]
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    profiles:
      - distributed
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

  # ------------------------------------------------------------------
  # Celery Flower 监控面板（可选，用于查看 worker 状态和任务进度）
  #   访问: http://localhost:5555
  # ------------------------------------------------------------------
  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-celery-flower
    ports:
      - "5555:5555"
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TZ=Asia/Shanghai
    command: >
      celery -A pipeline.batch_runner.celery_app flower
             --port=5555
             --broker_api=redis://redis:6379/0
             --basic_auth=${FLOWER_AUTH:-admin:admin123}
             --persistent=True
             --db=/app/results/flower.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./results:/app/results
    profiles:
      - distributed
      - monitoring
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5555/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    restart: unless-stopped

  # 性能测试服务
  benchmark:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-sim-benchmark
    volumes:
      - ./results:/app/results
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    command: python -m examples.performance_benchmark
    profiles:
      - benchmark

  # 单元测试服务
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-sim-test
    volumes:
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
    command: pytest tests/ -v --tb=short
    profiles:
      - test

  # ------------------------------------------------------------------
  # 回归测试服务（配置驱动的实验编排与 CI 回归）
  #   用法：
  #     docker compose run --rm regression
  #     docker compose run --rm regression pytest experiments/ -v -k mask_optimization
  #     docker compose run --rm regression python -m experiments.run_experiments experiments/ --generate-golden
  # ------------------------------------------------------------------
  regression:
    build:
      context: ./backend
      dockerfile: Dockerfile
      <<: *common-build
    container_name: litho-regression
    volumes:
      - ./backend:/app
      - ./experiment_results:/app/experiment_results
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    command: pytest experiments/ -v --tb=short
    profiles:
      - regression
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '1.0'

# ----------------------------------------------------------------------
# 挂载卷
# ----------------------------------------------------------------------
volumes:
  redis_data:
