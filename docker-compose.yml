# 计算光刻仿真框架 Docker Compose 配置

services:
  # 后端仿真服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-sim-backend
    volumes:
      # 挂载结果输出目录
      - ./results:/app/results
      # 挂载配置文件（可选）
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    # 运行优化示例
    command: python -m examples.run_optimization
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # 性能测试服务
  benchmark:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-sim-benchmark
    volumes:
      - ./results:/app/results
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    command: python -m examples.performance_benchmark
    profiles:
      - benchmark

  # 单元测试服务
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-sim-test
    volumes:
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
    command: pytest tests/ -v --tb=short
    profiles:
      - test
