# 计算光刻仿真框架 Docker Compose 配置
#
# 一键部署（前后端 Web 工作台）:
#   docker compose up -d --build
#   然后访问: http://localhost:8080
#
# 仅命令行使用（原 backend CLI 服务）:
#   docker compose run --rm backend python -m examples.run_optimization
#

services:
  # ============================================================
  # [默认启动] 后端 API 服务（FastAPI）
  # ============================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: litho-api
    restart: unless-stopped
    volumes:
      - ./results:/app/results
      - ./backend/api/saved_configs:/app/api/saved_configs
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - TZ=Asia/Shanghai
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 1G

  # ============================================================
  # [默认启动] 前端 admin（Vue3 + Nginx 反代 /api）
  # ============================================================
  web:
    build: ./frontend-admin
    container_name: litho-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ============================================================
  # 后端 CLI 服务（命令行运行示例；默认不启动）
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-sim-backend
    profiles: ["cli"]
    volumes:
      # 挂载结果输出目录
      - ./results:/app/results
      # 挂载版图/GDS 输入目录
      - ./layout_library:/app/layout_library:ro
      # 挂载配置文件（可选）
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    # 运行优化示例
    command: python -m examples.run_optimization
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ------------------------------------------------------------------
  # 批处理调度：分布式模式需要的 Redis 消息队列
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: litho-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./redis_data:/data
    ports:
      - "6379:6379"
    profiles:
      - distributed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # Celery Worker（分布式优化执行节点，可水平扩展）
  #   启动多 worker 示例：
  #     docker compose up --scale celery_worker=4
  # ------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./results:/app/results
      - ./layout_library:/app/layout_library:ro
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_QUEUE=litho_batch
    command: >
      sh -c "
        pip install -q 'celery>=5.3' 'redis>=4.5' || true &&
        celery -A pipeline.batch_runner.celery_app
               worker
               -Q $${CELERY_QUEUE:-litho_batch}
               --concurrency=$${CELERY_CONCURRENCY:-2}
               --loglevel=INFO
               --hostname=worker@%h
               --pool=prefork
      "
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - distributed
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    restart: on-failure

  # ------------------------------------------------------------------
  # 批处理调度器服务（本地多进程模式；若需分布式，可改调用 runner=distributed）
  #   用法：
  #     docker compose run --rm batch_runner \
  #       --source /app/layout_library --layer 0 \
  #       --output-dir /app/results/batch_run
  # ------------------------------------------------------------------
  batch_runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-batch-runner
    volumes:
      - ./results:/app/results
      - ./layout_library:/app/layout_library:ro
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - BATCH_MODE=local
      - BATCH_MAX_WORKERS=4
    entrypoint: ["python", "-m", "pipeline.batch_runner_cli"]
    profiles:
      - batch
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  # ------------------------------------------------------------------
  # 批处理调度器（分布式模式 - 提交任务到 Redis/Celery 集群）
  # ------------------------------------------------------------------
  batch_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-batch-scheduler
    volumes:
      - ./results:/app/results
      - ./layout_library:/app/layout_library:ro
      - ./backend/config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    entrypoint: ["python", "-m", "pipeline.batch_runner_cli"]
    command: ["--mode", "distributed"]
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - distributed
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # 性能测试服务
  benchmark:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-sim-benchmark
    volumes:
      - ./results:/app/results
    environment:
      - PYTHONPATH=/app
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    command: python -m examples.performance_benchmark
    profiles:
      - benchmark

  # 单元测试服务
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litho-sim-test
    volumes:
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
    command: pytest tests/ -v --tb=short
    profiles:
      - test

# ----------------------------------------------------------------------
# 挂载卷
# ----------------------------------------------------------------------
volumes:
  redis_data:
